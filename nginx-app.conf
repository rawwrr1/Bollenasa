server {
    listen 80;
    server_name bollenasa.arusdigital.cloud;
    root /usr/share/nginx/html;
    index HTML/home.html;

    # ----------------------------------------------------------------------
    # SECURITY HARDENING
    # ----------------------------------------------------------------------
    
    # 1. Hide Nginx Version
    server_tokens off;

    # 2. Security Headers
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Block XSS attacks
    add_header X-XSS-Protection "1; mode=block" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS (HTTP Strict Transport Security) - Force HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Permissions Policy - Disable unused features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    
    # 3. Content Security Policy (CSP)
    # Allows: Local scripts/styles/images, Google Fonts, Inline Styles (needed for some elements), and Google Maps embedding
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self' https://www.google.com;" always;

    # ----------------------------------------------------------------------

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Block access to hidden files (like .git, .env)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Handle static files directly
    location /CSS/ {
        try_files $uri =404;
    }
    location /Gambar/ {
        try_files $uri =404;
    }
    location /main.js {
        try_files $uri =404;
    }

    # Handle HTML navigation
    location / {
        try_files $uri $uri/ /HTML/$uri /HTML/home.html;
    }

    # Disable logs for favicon and robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
